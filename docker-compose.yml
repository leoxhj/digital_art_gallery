services:
  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_DB: ${PGDATABASE:-digital_art_gallery}
      POSTGRES_USER: ${PGUSER:-gallery}
      POSTGRES_PASSWORD: "${PGPASSWORD:?Set PGPASSWORD in .env before starting the containers}"
    volumes:
      - gallery_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gallery:
    build:
      context: .
      dockerfile: Dockerfile
    image: digital-art-gallery:latest
    restart: unless-stopped
    ports:
      - "8080:5001"
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "5001"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-digital_art_gallery}
      PGUSER: ${PGUSER:-gallery}
      PGPASSWORD: "${PGPASSWORD:?Set PGPASSWORD in .env before starting the container}"
      AUTHOR_BIRTHDAY: ${AUTHOR_BIRTHDAY:-2017-09-04}
      ARTWORK_AUTHOR: ${ARTWORK_AUTHOR:-}
      WATERMARK_OPACITY: ${WATERMARK_OPACITY:-0.28}
      WATERMARK_FONT_SIZE: ${WATERMARK_FONT_SIZE:-16px}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5001/api/drawings').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  gallery_data: